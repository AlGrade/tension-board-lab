name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that lands while an earlier run is still going makes that run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # Torch from the CPU index: the default wheel pulls a CUDA runtime this never uses.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,export]"

      - name: Lint
        run: ruff check .

      - name: Test
        # No checkpoint or board database in the repo, so the tests that need one skip
        # themselves: 81 run, 18 skip. What runs still covers the tokenizer, the constraints,
        # the physical tables, the model and the loss.
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        # The parity suites compare against artifacts the export produces from a trained
        # checkpoint, which the repo does not carry, so they skip. Only the artifact-free
        # logic runs here; parity is checked locally after tension-export-web.
        run: npm test

      - name: Build
        run: npm run build
