[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tension-board-lab"
version = "0.1.0"
description = "Models and tools for Tension Board 2 boulder problems: grade prediction and problem generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Gradenegger" }]
keywords = ["climbing", "tension-board", "transformer", "onnx", "generative-model"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
]

[project.urls]
Repository = "https://github.com/AlGrade/tension-board-lab"
Issues = "https://github.com/AlGrade/tension-board-lab/issues"

[project.optional-dependencies]
data = ["boardlib>=0.15,<0.16"]
export = [
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
tension-inspect-db = "tension_board_lab.aurora:inspect_main"
tension-import-aurora = "tension_board_lab.aurora:import_main"
tension-train-grade = "tension_board_lab.grade.train:main"
tension-predict = "tension_board_lab.grade.predict:main"
tension-train-generator = "tension_board_lab.generator.train:main"
tension-sample = "tension_board_lab.generator.sample:main"
tension-eval-generator = "tension_board_lab.generator.evaluate:main"
tension-export-onnx = "tension_board_lab.export.onnx:main"
tension-export-web = "tension_board_lab.export.artifacts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors the package, so basenames repeat across subdirectories.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit rather than inherited: the default set moves between ruff releases, and E501 is
# not in it at all, so the configured line length above went unchecked. B catches the quiet
# ones - notably zip() without strict=, which truncates silently.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Tests build fixtures by zipping fixed-length literals; the strict= noise is not worth it.
"tests/*" = ["B905"]
