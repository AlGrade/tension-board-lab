worker_processes auto;
worker_rlimit_nofile 1024;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format container '$remote_addr - $request_method $uri $status $body_bytes_sent '
                         'rt=$request_time ua="$http_user_agent"';
    access_log /dev/stdout container;

    # The image runs with a read-only root filesystem. All possible nginx scratch paths live in
    # the small, no-exec tmpfs supplied by Compose.
    client_body_temp_path /tmp/client-body 1 2;
    proxy_temp_path /tmp/proxy 1 2;
    fastcgi_temp_path /tmp/fastcgi 1 2;
    uwsgi_temp_path /tmp/uwsgi 1 2;
    scgi_temp_path /tmp/scgi 1 2;

    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

        # Answered here rather than proxied anywhere: this container is the whole deployment,
        # so its own ability to serve is the entire health signal.
        location = /healthz {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"ok":true}';
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # A location-level add_header replaces inherited values on nginx, so keep the
            # response hardening alongside the immutable asset header.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        }

        location ^~ /models/ {
            try_files $uri =404;
            expires 1h;
        }

        location ^~ /data/ {
            try_files $uri =404;
            expires 1h;
        }

        location ^~ /board/ {
            try_files $uri =404;
            expires 1d;
        }

        # Vite's client routes are served by index.html; never cache that shell across deploys.
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
